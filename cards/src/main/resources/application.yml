server:
  port: 9090

spring:
  application:
    name: "cards"

  profiles:
    active: "prod"

  datasource:
    url: jdbc:mysql://localhost:3308/cardsDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

  config:
    import: "optional:configserver:http://localhost:8071/"
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
     defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "cards-ms"
    description: "EazyBank Cards-Microservice"
    version: "1.0.0"
logging:
  level:
    com:
      eazybank:
        cards: DEBUG