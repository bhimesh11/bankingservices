server:
  port: 9090

spring:
  application:
    name: "cards"

  profiles:
    active: "prod"

  datasource:
    url: jdbc:mysql://cardsdb:3308/cardsDB
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

  config:
    import: "optional:configserver:http://configserver-ms:8071/"
management:
  endpoints:
    web:
      exposure:
        include: "*"
