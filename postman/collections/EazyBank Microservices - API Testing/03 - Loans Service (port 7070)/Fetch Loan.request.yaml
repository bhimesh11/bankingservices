$kind: http-request
description: Requires eazybank-correlation-id request header.
url: localhost/{{loansBaseUrl}}/api/loans/fetch
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: eazybank-correlation-id
    value: "{{$guid}}"
    description: Required by Cards and Loans fetch endpoints
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Expected HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
