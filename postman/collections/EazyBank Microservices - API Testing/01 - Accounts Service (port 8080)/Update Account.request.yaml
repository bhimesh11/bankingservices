$kind: http-request
description: "Controller: PUT /api/update. Update with an existing mobile/customer record."
url: localhost/{{accountsBaseUrl}}/api/update
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test Customer Updated",
      "email": "postman.updated@example.com",
      "mobileNumber": "9876543210",
      "accountsDTO": {
        "accountNumber": "1234567890",
        "accountType": "Savings",
        "branchAddress": "Hyderabad"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Update response is 200 or 417', function () { pm.expect(pm.response.code).to.be.oneOf([200,417]); });
    language: text/javascript
order: 3000
