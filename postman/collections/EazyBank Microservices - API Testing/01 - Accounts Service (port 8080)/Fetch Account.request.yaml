$kind: http-request
description: "Controller: GET /api/fetch?mobileNumber=..."
url: localhost/{{accountsBaseUrl}}/api/fetch
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Expected HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
