$kind: http-request
description: Controller deliberately throws NullPointerException and relies on Retry/fallback; expect fallback response if configured.
url: localhost/{{accountsBaseUrl}}/api/build-info
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Build info endpoint responds', function () { pm.expect(pm.response.code).to.be.oneOf([200,500]); });
    language: text/javascript
order: 4000
