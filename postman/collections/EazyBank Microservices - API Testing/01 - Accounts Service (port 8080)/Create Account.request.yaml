$kind: http-request
description: "Controller: POST /api/create. Uses CustomerDTO; check AccountsDTO fields in the service DTO if your branch differs."
url: localhost/{{accountsBaseUrl}}/api/create
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test Customer",
      "email": "postman.test@example.com",
      "mobileNumber": "9876543210",
      "accountsDTO": {
        "accountNumber": "1234567890",
        "accountType": "Savings",
        "branchAddress": "Hyderabad"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Expected HTTP 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
