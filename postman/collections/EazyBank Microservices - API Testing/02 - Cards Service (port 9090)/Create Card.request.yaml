$kind: http-request
description: "Controller: POST /api/cards/create?mobileNumber=...; request parameter, not JSON body."
url: localhost/{{cardsBaseUrl}}/api/cards/create
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Expected HTTP 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
