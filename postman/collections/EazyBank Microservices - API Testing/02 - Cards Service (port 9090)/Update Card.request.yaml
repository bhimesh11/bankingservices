$kind: http-request
description: "Use existing card number/customer. DTO constraints: 10-digit mobile, 12-digit card number, positive totalLimit."
url: localhost/{{cardsBaseUrl}}/api/cards/update
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "mobileNumber": "9876543210",
      "cardNumber": "123456789012",
      "cardType": "Credit Card",
      "totalLimit": 100000,
      "amountUsed": 1000,
      "availableAmount": 99000
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Update response is 200 or 417', function () { pm.expect(pm.response.code).to.be.oneOf([200,417]); });
    language: text/javascript
order: 3000
