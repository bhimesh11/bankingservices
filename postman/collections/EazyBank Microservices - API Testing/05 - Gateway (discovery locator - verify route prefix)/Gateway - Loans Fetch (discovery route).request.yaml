$kind: http-request
description: Discovery locator enabled; assumes /loans/**. Loans fetch requires correlation header.
url: localhost/{{gatewayBaseUrl}}/loans/api/loans/fetch
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: eazybank-correlation-id
    value: "{{$guid}}"
    description: Required by Cards and Loans fetch endpoints
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 3000
