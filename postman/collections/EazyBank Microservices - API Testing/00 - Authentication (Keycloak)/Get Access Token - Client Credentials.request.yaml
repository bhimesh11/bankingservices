$kind: http-request
description: OAuth2 client_credentials. This grant returns an access_token, not an ID token. Configure confidential client and service accounts in Keycloak.
url: http://localhost:8080/realms/master/protocol/openid-connect/token
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    grant_type: client_credentials
    client_id: eazybank-callcenter-cc
    client_secret: y1cfkZstoumcF1zP9pOU0uGOMtjAdDRAfYjrfTRAg APLy9s16Q1AGidg2zEdHrzF2WZrc0tsLHkHBGMayVi4pG
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Token endpoint returned success', function () { pm.expect(pm.response.code).to.be.oneOf([200,201]); });
      const json = pm.response.json();
      pm.expect(json.access_token, 'access_token').to.be.a('string').and.not.empty;
      pm.environment.set('access_token', json.access_token);
      pm.environment.set('token_type', json.token_type || 'Bearer');
    language: text/javascript
order: 1000
