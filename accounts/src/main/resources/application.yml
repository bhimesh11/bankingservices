server:
  port: 8080

spring:
  application:
    name: "accounts"
  profiles:
    active: "PROD" 

  datasource:
    # NOTE: Change 'localhost' to 'accountsdb' if this is for Docker PROD
    url: jdbc:mysql://localhost:3316/accountsDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always

  config:
    # NOTE: Change 'localhost' to 'configserver' if this is for Docker PROD
    import: "optional:configserver:http://localhost:8071/"
  
  cloud:
    openfeign:
      circuitbreaker: # <-- FIXED TYPO
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      # NOTE: Change 'localhost' to 'eurekaserver' if this is for Docker PROD
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "accounts-ms"
    description: "Eazy Bank Accounts-Microservice"
    version: "1.0.0"
    
logging:
  level:
    com:
      eazybank:
        accounts: DEBUG

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      minimumNumberOfCalls: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 500
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
      ignoreExceptions:
        - java.lang.NullPointerException
      retryExceptions:
        - java.util.concurrent.TimeoutException

resilience4j.ratelimiter:
  configs:
    default:
      timeoutDuration: 1000
      limitRefreshPeriod: 5000
      limitForPeriod: 1
 